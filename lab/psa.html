<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>명화 프사 시안실</title>
<style>
  :root { --bg: #f4efe6; --ink: #2a2433; --muted: #6d6576; --line: #ddd3c2; --wine: #7c1d35; --card: #fffdf8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-left)) 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  .set { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 28px; display: grid; gap: 22px; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); }
  @media (max-width: 760px) { .set { grid-template-columns: 1fr; } }
  .set h2 { margin: 0 0 2px; font-size: 1.2rem; }
  .set .src { color: var(--muted); font-size: .85rem; margin: 0 0 14px; }
  /* phone mockup of the Kakao profile screen */
  .phone { position: relative; width: 100%; max-width: 320px; aspect-ratio: 9 / 16; border-radius: 26px; overflow: hidden; background: #222; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .phone .bgimg { position: absolute; inset: 0; background-repeat: no-repeat; }
  .phone .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 70%, rgba(0,0,0,.55)); }
  .phone .pf { position: absolute; left: 50%; top: 65%; width: 28%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 40%; background-repeat: no-repeat; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .phone .nm { position: absolute; left: 0; right: 0; top: 74%; text-align: center; color: #fff; font-weight: 600; font-size: .95rem; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .phone .st { position: absolute; left: 6%; right: 6%; top: 79%; text-align: center; color: #eee; font-size: .68rem; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .phone .bar { position: absolute; left: 6%; right: 6%; bottom: 4%; border-top: 1px solid rgba(255,255,255,.5); padding-top: 8px; display: flex; justify-content: space-around; color: #fff; font-size: .6rem; text-align: center; }
  .phone .bar span::before { content: ""; display: block; width: 20px; height: 20px; margin: 0 auto 3px; border: 1.5px solid #fff; border-radius: 50%; }
  .phone, .pf, .pfsolo { container-type: inline-size; }
  .wm { position: absolute; right: 5.2%; top: 20%; text-align: right; color: rgba(255,255,255,.88); text-shadow: 0 0 .4cqw rgba(0,0,0,.6); line-height: 1.25; pointer-events: none; }
  .wm b { display: block; font-size: 3.15cqw; } .wm span { font-size: 2.6cqw; }
  .pwm { position: absolute; left: 0; right: 0; bottom: 5%; text-align: center; color: rgba(255,255,255,.8); font-size: 3.6cqw; text-shadow: 0 0 .8cqw rgba(0,0,0,.7); pointer-events: none; }
  .solo { display: flex; gap: 14px; align-items: center; margin-top: 14px; }
  .solo .pfsolo { position: relative; width: 84px; aspect-ratio: 1; border-radius: 40%; background-repeat: no-repeat; flex: none; }
  .solo small { color: var(--muted); }
  .ctl { display: grid; gap: 14px; align-content: start; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px 12px; margin: 0; }
  legend { font-weight: 600; padding: 0 6px; }
  label { display: grid; grid-template-columns: 4.5em 1fr 3.5em; gap: 10px; align-items: center; font-size: .88rem; }
  output { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--wine); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; border: 1px solid var(--wine); background: var(--wine); color: #fff; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--wine); }
  button:focus-visible { outline: 3px solid #e2b04a; outline-offset: 2px; }
  .vals { font: 12px/1.5 ui-monospace, Menlo, monospace; background: #f6f1e8; border-radius: 8px; padding: 8px 10px; color: var(--muted); word-break: break-all; }
  .err { color: var(--wine); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>명화 프사 시안실</h1>
  <p class="lead">비공개 테스트 페이지입니다(메뉴·검색 노출 없음). 배경의 '위치'는 프로필 사진 바로 밑에 오는 지점이에요. 슬라이더로 자르는 위치를 맞춰 보고, 마음에 들면 아래 값을 복사해 Claude에게 알려 주세요. 이미지 저장 버튼으로 실제 크기 파일도 받을 수 있어요.</p>
  <div id="sets"></div>
</main>
<script>
// Public-domain paintings served through our own /img/ route (Wikimedia Commons cache).
const SETS = [
  {
    id: 'starry', title: '고흐 〈별이 빛나는 밤〉 — 내가 달이 된다',
    src: '빈센트 반 고흐, 1889 · 퍼블릭 도메인 (Wikimedia Commons)',
    img: '/img/thumb/0/01/Vincent_van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1920px-Vincent_van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg',
    status: '소용돌이치는 밤하늘 · 드뷔시 「달빛」',
    // pf focus = point shown at the centre of the profile photo; bg focus = point that sits right under the profile photo; zoom 1 = just covers
    pf: { x: 0.87, y: 0.14, z: 4.5 },
    bg: { x: 0.45, y: 0.33, z: 1.35 },
  },
  {
    id: 'adam', title: '미켈란젤로 〈아담의 창조〉 — 닿기 직전의 손끝',
    src: '미켈란젤로 부오나로티, 1508~1512 · 퍼블릭 도메인 (Wikimedia Commons)',
    img: '/img/thumb/5/5b/Michelangelo_-_Creation_of_Adam_(cropped).jpg/1920px-Michelangelo_-_Creation_of_Adam_(cropped).jpg',
    status: '닿기 직전의 손끝 · 헨델 「할렐루야」',
    pf: { x: 0.50, y: 0.40, z: 5.0 },
    bg: { x: 0.545, y: 0.38, z: 2.0 },
  },
];

// Where Kakao shows the profile photo on the background (approximate): centre at 50% / 65%, 28% of the width.
const PF_CX = 0.5, PF_CY = 0.65, PF_W = 0.28;

function layout(iw, ih, W, H, f, cx = 0.5, cy = 0.5) {
  const s = Math.max(W / iw, H / ih) * f.z, dw = iw * s, dh = ih * s;
  let x = W * cx - f.x * dw, y = H * cy - f.y * dh;
  x = Math.min(0, Math.max(W - dw, x)); y = Math.min(0, Math.max(H - dh, y));
  return { dw, dh, x, y };
}
function applyCss(el, im, f, cx = 0.5, cy = 0.5) {
  const r = el.getBoundingClientRect(); if (!r.width) return;
  const L = layout(im.naturalWidth, im.naturalHeight, r.width, r.height, f, cx, cy);
  el.style.backgroundImage = 'url("' + im.src + '")';
  el.style.backgroundSize = L.dw + 'px ' + L.dh + 'px';
  el.style.backgroundPosition = L.x + 'px ' + L.y + 'px';
}
// Watermark so friends who see the photo can find the site and make their own.
// Background: upper right, clear of Kakao's top icons and the name/buttons at the bottom. Profile: small, bottom centre.
const WM_FONT = '"Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif';
function watermark(g, W, H) {
  g.save(); g.fillStyle = 'rgba(255,255,255,.88)'; g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = W * .006;
  if (W === H) {
    g.textAlign = 'center'; g.font = '500 ' + Math.round(W * .036) + 'px ' + WM_FONT; g.fillStyle = 'rgba(255,255,255,.8)';
    g.fillText('yummyclassic', W / 2, H * .93);
  } else {
    g.textAlign = 'right'; const x = W * .948, y = H * .2;
    g.font = '700 ' + Math.round(W * .0315) + 'px ' + WM_FONT; g.fillText('냠냠클래식 명화 프사', x, y + W * .03);
    g.font = '400 ' + Math.round(W * .026) + 'px ' + WM_FONT; g.fillText('yummyclassic.co.kr', x, y + W * .065);
  }
  g.restore();
}
function save(im, f, W, H, name, cx = 0.5, cy = 0.5) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const L = layout(im.naturalWidth, im.naturalHeight, W, H, f, cx, cy);
  const g = c.getContext('2d');
  g.drawImage(im, L.x, L.y, L.dw, L.dh);
  watermark(g, W, H);
  c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }, 'image/jpeg', .92);
}

const root = document.getElementById('sets');
SETS.forEach(S => {
  const el = document.createElement('section'); el.className = 'set';
  el.innerHTML = `
    <div>
      <h2></h2><p class="src"></p>
      <div class="phone"><div class="bgimg"></div><div class="shade"></div><div class="wm"><b>냠냠클래식 명화 프사</b><span>yummyclassic.co.kr</span></div><div class="pf"><div class="pwm">yummyclassic</div></div>
        <div class="nm">냠냠클래식</div><div class="st"></div>
        <div class="bar"><span>나와의 채팅</span><span>프로필 편집</span><span>카카오스토리</span></div></div>
      <div class="solo"><div class="pfsolo"><div class="pwm">yummyclassic</div></div><small>채팅 목록에서 프로필만 보일 때</small></div>
      <p class="err" hidden>그림을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>
    </div>
    <div class="ctl"></div>`;
  el.querySelector('h2').textContent = S.title;
  el.querySelector('.src').textContent = S.src;
  el.querySelector('.st').textContent = S.status;
  const ctl = el.querySelector('.ctl');
  const groups = [['pf', '프로필 사진 (원 안)'], ['bg', '배경 사진']];
  const vals = document.createElement('div'); vals.className = 'vals';
  groups.forEach(([k, name]) => {
    const fs = document.createElement('fieldset'); fs.innerHTML = '<legend></legend>'; fs.querySelector('legend').textContent = name;
    [['x', '가로 위치', 0, 1, .005], ['y', '세로 위치', 0, 1, .005], ['z', '확대', 1, 8, .05]].forEach(([p, lab, mn, mx, st]) => {
      const id = S.id + '-' + k + '-' + p;
      const l = document.createElement('label'); l.htmlFor = id;
      l.innerHTML = `<span></span><input type="range" id="${id}" min="${mn}" max="${mx}" step="${st}"><output></output>`;
      l.querySelector('span').textContent = lab;
      const inp = l.querySelector('input'), out = l.querySelector('output');
      inp.value = S[k][p]; out.textContent = (+inp.value).toFixed(2);
      inp.addEventListener('input', () => { S[k][p] = +inp.value; out.textContent = (+inp.value).toFixed(2); draw(); });
      fs.append(l);
    });
    ctl.append(fs);
  });
  const btns = document.createElement('div'); btns.className = 'btns';
  btns.innerHTML = '<button type="button" data-a="pf">프로필 저장 (640×640)</button><button type="button" data-a="bg">배경 저장 (1080×1920)</button><button type="button" class="ghost" data-a="copy">값 복사</button>';
  ctl.append(btns, vals);
  root.append(el);

  const im = new Image();
  const bgEl = el.querySelector('.bgimg'), pfEl = el.querySelector('.pf'), soloEl = el.querySelector('.pfsolo');
  function draw() {
    if (!im.naturalWidth) return;
    applyCss(bgEl, im, S.bg, PF_CX, PF_CY); applyCss(pfEl, im, S.pf); applyCss(soloEl, im, S.pf);
    vals.textContent = JSON.stringify({ id: S.id, pf: S.pf, bg: S.bg });
  }
  im.onload = draw; im.onerror = () => { el.querySelector('.err').hidden = false; };
  im.src = S.img;
  window.addEventListener('resize', draw);
  btns.addEventListener('click', e => {
    const a = e.target.dataset.a; if (!a || !im.naturalWidth) return;
    if (a === 'pf') save(im, S.pf, 640, 640, S.id + '_profile.jpg');
    if (a === 'bg') save(im, S.bg, 1080, 1920, S.id + '_background.jpg', PF_CX, PF_CY);
    if (a === 'copy') navigator.clipboard.writeText(vals.textContent).then(() => { e.target.textContent = '복사됨'; setTimeout(() => e.target.textContent = '값 복사', 1500); }).catch(() => {});
  });
});
</script>
</body>
</html>
