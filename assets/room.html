<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>냠냠클래식 미니룸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 방향: 와인 빛 어두운 서재 + 호박색 포인트. 단일 테마. 좌측 방 무대, 우측 아이템 서랍. */
:root{
  --bg:#171012; --bg2:#21171a; --panel:#2a1e22; --line:#4b393e;
  --ink:#f3e7d7; --mute:#b7a596; --amber:#e8b45a; --wine:#9a3248;
  --ok:#7bc98f; --bad:#e2655b;
  --display:'Gowun Batang',serif; --body:'Gowun Dodum',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
body{overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--display);font-size:20px;margin:0;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--mute)}
.grp{display:flex;align-items:center;gap:6px}
.grp>label{font-size:12px;color:var(--mute);margin-right:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 10px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--amber);color:#2a1a0c}
.seg button:hover:not(.on){background:#3a2a2f}
.btn{background:#3a2a2f;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--amber)}
.btn.pri{background:var(--amber);color:#2a1a0c;border-color:var(--amber)}
.btn:disabled{opacity:.4;cursor:not-allowed}
main{display:flex;min-height:0}
#stage{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#2c1d22 0%,#171012 70%)}
#room{filter:contrast(1.12) saturate(1.22);width:100%;height:100%;max-height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
#room .it{cursor:grab}
#side{width:372px;flex:none;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
#ytw{display:none;flex:none;background:#0d0a0a;border-bottom:1px solid var(--line)}#ytw.on{display:block}
.yth{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12px;color:var(--mute)}.yth span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.yth button,.yth a{background:#3a2a2f;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11.5px;color:var(--ink);text-decoration:none;white-space:nowrap}
#ytbox{position:relative;aspect-ratio:16/9;background:#000}#ytbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yterr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--mute);text-align:center;padding:10px}
.yterr a{color:var(--amber)}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);
  padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#hint{position:absolute;left:12px;top:10px;font-size:12px;color:var(--mute);max-width:46%;line-height:1.5;pointer-events:none}
#panel{flex:1;background:var(--panel);display:flex;flex-direction:column;min-height:0}
#tip{display:none;margin:0;padding:9px 12px;font-size:12.5px;line-height:1.5;color:var(--mute);border-bottom:1px solid var(--line)}#tip b{color:var(--amber);font-weight:400}
.card.pick{border-color:var(--amber);background:#42302a}
#tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px;border-bottom:1px solid var(--line)}
#tabs button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px}
#tabs button.on{background:var(--wine);border-color:var(--wine)}
#grid{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.card{background:#35262b;border:1px solid var(--line);border-radius:10px;padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;
  touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card:hover{border-color:var(--amber)}
.card svg{width:100%;height:64px}
.card b{font-weight:400;font-size:11.5px;text-align:center;line-height:1.25}
.card.fixed b::after{content:" · 고정";color:var(--amber)}
.sw{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px;border:1px solid var(--line);background:#35262b;font-size:12.5px;text-align:left}
.sw i{width:26px;height:26px;border-radius:6px;border:1px solid #0006;flex:none}
.sw.on{border-color:var(--amber)}
.sect{grid-column:1/-1;font-size:12px;color:var(--mute);margin:6px 2px 0}
footer#dock{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);background:var(--bg2);min-height:52px}
#dock .sel{font-size:14px;margin-right:auto}
#dock .sel small{color:var(--mute);margin-left:8px}
#now{font-size:13px;color:var(--amber)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;max-height:90%;overflow:auto;padding:18px}
.sheet h2{font-family:var(--display);margin:0 0 4px;font-size:19px}
.sheet p{margin:0 0 12px;color:var(--mute);font-size:13px}
.lps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.lp{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#35262b;text-align:left}
.lp:hover:not(:disabled){border-color:var(--amber)}
.lp.cur{border-color:var(--amber);background:#42302a}
.lp:disabled{opacity:.45;cursor:not-allowed}
.disc{width:44px;height:44px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--c) 0 28%,#18181b 29% 100%);box-shadow:inset 0 0 0 3px #26262b}
.lp b{display:block;font-weight:400;font-size:14px}
.lp small{color:var(--mute);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.row>span{width:64px;font-size:12.5px;color:var(--mute)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid #0006}
.dot.on{outline:2px solid var(--amber);outline-offset:2px}
.chip{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:#35262b;font-size:13px}
.chip.on{background:var(--amber);color:#2a1a0c;border-color:var(--amber)}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
@media (max-width:820px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  main{flex-direction:column}
  #stage{flex:none;aspect-ratio:700/560;width:100%}
  #side{width:100%;border-left:0;border-top:1px solid var(--line)}
  #ytw{order:2;border-bottom:0;border-top:1px solid var(--line)}
  #panel{height:340px;flex:none}
  #grid{grid-template-columns:repeat(4,1fr)}
  #hint{display:none}
  .brand span{display:none}
  header{padding:8px 10px;flex-wrap:nowrap;overflow-x:auto;gap:10px}
  header .grp,.brand{flex:none}
  .brand h1{font-size:16px}
  .grp>label{display:none}
  .btn,.seg button{white-space:nowrap}
}
@media (max-width:820px),(pointer:coarse){
  #tip{display:block}
  .btn,.seg button{min-height:42px;font-size:14.5px;padding-left:14px;padding-right:14px}
  #dock{gap:10px}
  #dock .btn{min-height:46px;font-size:15px;padding-left:18px;padding-right:18px}
  #tabs button{padding:8px 13px;font-size:13.5px}
}
@media (max-width:520px){ #grid{grid-template-columns:repeat(3,1fr)} .lps{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ #room *{animation:none!important} }
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* 방 애니메이션 */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes flick{0%,100%{transform:scale(1,1)}25%{transform:scale(.9,1.12)}50%{transform:scale(1.08,.9)}75%{transform:scale(.94,1.08)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes shiver{0%,100%{transform:translateX(-.9px)}50%{transform:translateX(.9px)}}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes note{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(10px,-34px);opacity:0}}
@keyframes tick{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
@keyframes wind{0%{transform:translateY(0);opacity:0}30%{opacity:.9}100%{transform:translateY(16px);opacity:0}}
@keyframes fall{0%{transform:translate(0,-12px)}100%{transform:translate(8px,110px)}}
@keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-10px);opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><h1>나의 미니룸</h1><span>추천받은 곡이 LP로 꽂혀요</span></div>
    <div class="grp"><label>처음 세팅</label>
      <div class="seg" id="presets"><button data-p="baroque">바로크방</button><button data-p="classic">고전방</button><button data-p="romantic">낭만방</button></div></div>
    <div class="grp"><label>계절</label>
      <div class="seg" id="seasons"><button data-s="spring">봄</button><button data-s="summer">여름</button><button data-s="autumn">가을</button><button data-s="winter">겨울</button></div></div>
    <div class="grp"><label>시간</label>
      <div class="seg" id="times"><button data-t="day">낮</button><button data-t="night">밤</button></div></div>
    <div class="grp"><button class="btn" id="bMini">미니미 꾸미기</button></div>
  </header>
  <main>
    <section id="stage">
      <svg id="room" viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="미니룸"></svg>
      <div id="hint">서랍에서 아이템을 끌어다 놓거나 눌러서 추가하세요. 방 안의 아이템은 끌어서 옮기고, 선택하면 아래에서 돌리거나 뺄 수 있어요.</div>
      <div id="toast"></div>
    </section>
    <div id="side"><div id="ytw"><div class="yth"><span id="ytt"></span><button id="ytn">다른 영상</button><a id="yta" target="_blank" rel="noopener">유튜브에서 열기</a><button id="ytx" aria-label="닫기">✕</button></div><div id="ytbox"><div id="ytp"></div></div></div><aside id="panel"><p id="tip">가구 카드를 <b>두 번 터치</b>하면 방에 들어가요. 방 안의 가구는 손가락으로 <b>끌어서</b> 옮길 수 있어요.</p><nav id="tabs"></nav><div id="grid"></div></aside></div>
  </main>
  <footer id="dock"></footer>
</div>

<div class="modal" id="mLP"><div class="sheet" id="sLP"></div></div>
<div class="modal" id="mMini"><div class="sheet" id="sMini"></div></div>

<script>
(()=>{
'use strict';
/* ================= 기본 상수·도우미 ================= */
const HW=40,HH=20,N=8,OX=350,OY=210,WH=190,WK=40;
const P=(x,y,z=0)=>[OX+(x-y)*HW,OY+(x+y)*HH-z];
const r1=v=>Math.round(v*10)/10;
const pts=a=>a.map(p=>r1(p[0])+','+r1(p[1])).join(' ');
const hx=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const rg=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const dk=(h,f)=>rg(hx(h).map(v=>v*f));
const lg=(h,f)=>rg(hx(h).map(v=>v+(255-v)*f));
const poly=(a,fill,st='none',sw=1)=>`<polygon points="${pts(a)}" fill="${fill}" stroke="${st}" stroke-width="${sw}" stroke-linejoin="round"/>`;
const R=(x,y,w,h,fill,ex='')=>`<rect x="${r1(x*100)/100}" y="${r1(y*100)/100}" width="${w}" height="${h}" fill="${fill}" ${ex}/>`;
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const range=(a,b,s)=>{const o=[];for(let v=a;v<b;v+=s)o.push(v);return o};
const snap=(v,s)=>Math.round(v/s)*s;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=s=>document.querySelector(s);
const COARSE=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
const T0=performance.now();
const tnow=()=>(performance.now()-T0)/1000;

/* 렌더 중 공유되는 값 */
const Q={season:'autumn',night:false,preview:false,gl:[],cur:null,playing:false};
function an(name,per,extra='',off=0,timing='linear'){
  if(Q.preview)return extra?`style="${extra}"`:'';
  return `style="animation:${name} ${per}s ${timing} infinite;animation-delay:-${((tnow()+off)%per).toFixed(2)}s;${extra}"`;
}

/* ================= 곡 데이터 ================= */
const COMP={
  bach:{n:'바흐',fr:'#8c6a3a',bg:'#6e8f9a'},
  pachelbel:{n:'파헬벨',fr:'#a9824a',bg:'#9a8a6a'},
  mozart:{n:'모차르트',fr:'#d6b25e',bg:'#a7c4d8'},
  beethoven:{n:'베토벤',fr:'#3b2a22',bg:'#7a6a58'},
  chopin:{n:'쇼팽',fr:'#c9ccd2',bg:'#5a5f78'},
  debussy:{n:'드뷔시',fr:'#7a8a62',bg:'#c9a78a'},
  tchaikovsky:{n:'차이콥스키',fr:'#a33a46',bg:'#8a98b0'}
};
function seqBach(){
  const bars=[[60,64,67,72,76],[60,62,69,74,77],[59,62,67,74,77],[60,64,67,72,76],[60,64,69,76,81],[60,62,66,69,74],[59,62,67,74,79],[59,60,64,67,72]];
  const ev=[];
  bars.forEach((b,i)=>{const s=i*16;ev.push([s,b[0]-12,15,.2]);const pat=[b[0],b[1],b[2],b[3],b[4],b[2],b[3],b[4]];for(let k=0;k<16;k++)ev.push([s+k,pat[k%8],3.4,.17]);});
  return{ev,len:136};
}
function seqPachelbel(){
  const bass=[50,45,47,42,43,50,43,45];
  const ch=[[62,66,69],[57,61,64],[59,62,66],[54,57,61],[55,59,62],[62,66,69],[55,59,62],[57,61,64]];
  const mel=[78,76,74,73,71,69,71,73];
  const ev=[];
  for(let r=0;r<2;r++)for(let i=0;i<8;i++){
    const s=(r*8+i)*2,c=ch[i];
    ev.push([s,bass[i],2,.2]);
    [c[0],c[1],c[2],c[1]].forEach((n,k)=>ev.push([s+k*.5,n+(r?12:0),1.6,.1]));
    ev.push([s,mel[i]+(r?0:0),2.2,.2]);
  }
  return{ev,len:34};
}
function seqMozart(){
  const m=[[72,1],[72,1],[79,1],[79,1],[81,1],[81,1],[79,2],[77,1],[77,1],[76,1],[76,1],[74,1],[74,1],[72,2],[79,1],[79,1],[77,1],[77,1],[76,1],[76,1],[74,2],[79,1],[79,1],[77,1],[77,1],[76,1],[76,1],[74,2],[72,1],[72,1],[79,1],[79,1],[81,1],[81,1],[79,2],[77,1],[77,1],[76,1],[76,1],[74,1],[74,1],[72,2]];
  const ev=[];let t=0;m.forEach(([n,d])=>{ev.push([t,n,d*1.5,.2]);ev.push([t,n+12,d*1.1,.05]);t+=d});
  return{ev,len:t+2};
}
function seqBeethoven(){
  const n=[[76,1],[75,1],[76,1],[75,1],[76,1],[71,1],[74,1],[72,1],[69,3],[60,1],[64,1],[69,1],[71,3],[64,1],[68,1],[71,1],[72,3],[64,1],[76,1],[75,1],[76,1],[75,1],[76,1],[71,1],[74,1],[72,1],[69,3],[60,1],[64,1],[69,1],[71,3],[64,1],[72,1],[71,1],[69,4]];
  const bass={69:45,71:52,72:45};
  const ev=[];let t=0;
  n.forEach(([m,d])=>{ev.push([t,m,d*1.4,.2]);if(d>=3&&bass[m])ev.push([t,bass[m],d*2,.12]);t+=d});
  return{ev,len:t+3};
}
let LPS=[
  {id:'bach',comp:'bach',title:'평균율 1번 프렐류드',era:'바로크',color:'#c9a15a',yt:['riqsPb4hWXk','kfQFZrgJUt8','M9Pc72fipyo']},
  {id:'bach_air',comp:'bach',title:'G선상의 아리아',era:'바로크',color:'#b4763a',yt:['CzpbhkGCiLI','tZtF_5Gn9hA','E2j-frfK-yg','zqfIykfM26Y']},
  {id:'pachelbel',comp:'pachelbel',title:'캐논',era:'바로크',color:'#e0c6a0',yt:['6jSLH9CDPPQ','NlprozGcs80','JvNQLJ1_HQ0','9nX_ReyaetE']},
  {id:'mozart',comp:'mozart',title:'터키 행진곡',era:'고전',color:'#7aa6c8',yt:['5UvGf13H6wQ','qsoBpBuhb5o','XVsUIvaglSI','rDbYC_8xt4U']},
  {id:'mozart_night',comp:'mozart',title:'아이네 클라이네 나흐트무지크',era:'고전',color:'#4f7fb0',yt:['1E-qWsJceDk','z-ZBGf63rAw','tSL5-wxgvFY','QZWKUszkbXU']},
  {id:'beethoven',comp:'beethoven',title:'엘리제를 위하여',era:'고전·낭만',color:'#9a3248',yt:['MgFhNbFvl_s','2fcX2dWmR6g','GjbSqDgh1B4','o0VwTw1eZ1k']},
  {id:'beethoven_moon',comp:'beethoven',title:'월광 소나타 1악장',era:'고전·낭만',color:'#5a4a78',yt:['S4L9uS0XHeQ','nT7_IZPHHb0','JnBxRCQbcxs']},
  {id:'chopin',comp:'chopin',title:'녹턴 Op.9 No.2',era:'낭만',color:'#b9bfd0',yt:['YGRO05WcNDk','9E6b3swbnWg','tV5U8kVYS88','EMbblaF8jNY']},
  {id:'chopin_rain',comp:'chopin',title:'빗방울 전주곡',era:'낭만',color:'#7f93b8',yt:['HVau-JRGirg','pVLOcy253KI','R2d2spnXyLA']},
  {id:'debussy',comp:'debussy',title:'달빛',era:'인상주의',color:'#8aa070',yt:['FwEN89Tmgkc','Yri2JNhyG4k','LlvUepMa31o','zNpsy6lBPBw']},
  {id:'debussy_ara',comp:'debussy',title:'아라베스크 1번',era:'인상주의',color:'#d19a6a',yt:['JCTQTp1PdnA','KFgaz7snX5Y','5bCeBMqG6Ts']},
  {id:'tchaikovsky',comp:'tchaikovsky',title:'꽃의 왈츠',era:'낭만',color:'#c4505c',yt:['1aR92yQUS7s','Kw0wLLVEMaA','QE7wA6SHHzI','NLnfP9XTn-k']}
];
LPS.forEach(l=>{l.cn=COMP[l.comp].n});
const lpOf=id=>LPS.find(l=>l.id===id);

/* ================= 아이템 정의 ================= */
const DEF={};
const CATS=[['seat','소파·의자'],['table','테이블·수납'],['audio','음향·조명'],['inst','악기'],['plant','식물'],['prop','소품'],['wall','벽 장식'],['frame','작곡가 액자'],['season','계절'],['rug','러그'],['deco','벽지·바닥']];
function D(id,o){DEF[id]=Object.assign({id},o)}

/* ---- 그리기 컨텍스트 (로컬 좌표: 바닥 격자 단위, 높이 px) ---- */
function l2w(it,lx,ly,r){const d=DEF[it.t],W=d.w,Dd=d.d,x0=it.x,y0=it.y;r=(r===undefined?(it.f|0):r)%4;
  return r===0?[x0+lx,y0+ly]:r===1?[x0+ly,y0+lx]:r===2?[x0+W-lx,y0+Dd-ly]:[x0+Dd-ly,y0+W-lx]}
function w2l(it,wx,wy,r){const d=DEF[it.t],W=d.w,Dd=d.d,x0=it.x,y0=it.y;r=(r===undefined?(it.f|0):r)%4;
  return r===0?[wx-x0,wy-y0]:r===1?[wy-y0,wx-x0]:r===2?[W-(wx-x0),Dd-(wy-y0)]:[W-(wy-y0),Dd-(wx-x0)]}
function ctxFor(it){
  const r=(it.f|0)%4,z0=it.z||0,out=[],meta=[],vis=r<2;
  const M=(lx,ly)=>l2w(it,lx,ly,r);
  const S=(lx,ly,lz=0)=>{const m=M(lx,ly);return P(m[0],m[1],z0+lz)};
  const put=(s,k,z)=>{out.push(s);meta.push([k,z])};
  const c={out,S,f:r===1,vis,z0,
    box(lx,ly,lw,ld,h,col,lz=0,o={}){
      const a=M(lx,ly),b=M(lx+lw,ly+ld),X=Math.min(a[0],b[0]),Y=Math.min(a[1],b[1]),W=Math.abs(a[0]-b[0]),Dd=Math.abs(a[1]-b[1]),Z=z0+lz,st=o.st||dk(col,.3);
      put(poly([P(X,Y+Dd,Z),P(X+W,Y+Dd,Z),P(X+W,Y+Dd,Z+h),P(X,Y+Dd,Z+h)],o.cl||col,st)
        +poly([P(X+W,Y,Z),P(X+W,Y+Dd,Z),P(X+W,Y+Dd,Z+h),P(X+W,Y,Z+h)],o.cr||dk(col,.62),st)
        +(o.nt?'':poly([P(X,Y,Z+h),P(X+W,Y,Z+h),P(X+W,Y+Dd,Z+h),P(X,Y+Dd,Z+h)],o.ct||lg(col,.14),st)),X+W/2+Y+Dd/2,Z);
    },
    fp(a,b,z1,z2,ly,fill,st='none'){if(!vis)return;put(poly([S(a,ly,z1),S(b,ly,z1),S(b,ly,z2),S(a,ly,z2)],fill,st,.8),1e8,z1)},
    poly(arr,fill,st='none',sw=1){const k=arr.reduce((t,p)=>{const m=M(p[0],p[1]);return t+m[0]+m[1]},0)/arr.length;put(poly(arr.map(p=>S(p[0],p[1],p[2]||0)),fill,st,sw),k,(arr[0][2]||0)+z0)},
    ring(lx,ly,lz,rp,fill,st='none'){if(!vis)return;const a=[];for(let i=0;i<18;i++){const t=i/18*6.2832;a.push(S(lx+rp/HW*Math.cos(t),ly,lz+rp*Math.sin(t)))}put(poly(a,fill,st,.8),1e8,lz)},
    disc(lx,ly,lz,rr,fill,st='none',sw=1){const[x,y]=S(lx,ly,lz),m=M(lx,ly);put(`<ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${r1(rr*HW*1.414)}" ry="${r1(rr*HH*1.414)}" fill="${fill}" stroke="${st}" stroke-width="${sw}"/>`,m[0]+m[1],z0+lz)},
    cyl(lx,ly,rr,h,col,lz=0,o={}){
      const[x,y]=S(lx,ly,lz),m=M(lx,ly),rx=rr*HW*1.414,ry=rr*HH*1.414,st=o.st||dk(col,.3);
      put(`<path d="M${r1(x-rx)},${r1(y)} A${r1(rx)},${r1(ry)} 0 0 0 ${r1(x+rx)},${r1(y)} L${r1(x+rx)},${r1(y-h)} A${r1(rx)},${r1(ry)} 0 0 1 ${r1(x-rx)},${r1(y-h)} Z" fill="${o.cl||col}" stroke="${st}" stroke-width="1" stroke-linejoin="round"/>`
        +`<ellipse cx="${r1(x)}" cy="${r1(y-h)}" rx="${r1(rx)}" ry="${r1(ry)}" fill="${o.ct||lg(col,.16)}" stroke="${st}" stroke-width="1"/>`,m[0]+m[1],z0+lz);
    },
    plane(lx,ly,lz,inner){if(!vis)return;const[x,y]=S(lx,ly,lz);put(`<g transform="translate(${r1(x)},${r1(y)}) matrix(${r===1?-1:1},.5,0,-1,0,0)">${inner}</g>`,1e8,lz)},
    shadow(w,d,pad=.07){put(poly([S(-pad,-pad),S(w+pad,-pad),S(w+pad,d+pad),S(-pad,d+pad)],'rgba(0,0,0,.26)'),-1e8,0)},
    glow(lx,ly,lz,rr,kind){if(Q.night&&!Q.preview){const[x,y]=S(lx,ly,lz);Q.gl.push([x,y,rr,kind])}},
    raw(s){put(s,1e8,0)},
    html(){if(vis)return out.join('');return out.map((s,i)=>[s,meta[i],i]).sort((a,b)=>a[1][0]-b[1][0]||a[1][1]-b[1][1]||a[2]-b[2]).map(e=>e[0]).join('')}
  };
  return c;
}

const leaf=(x,y,len,wid,ang,col,st)=>`<g transform="translate(${r1(x)},${r1(y)}) rotate(${ang})"><path d="M0,0 C${r1(wid*.55)},${r1(-len*.25)} ${r1(wid*.55)},${r1(-len*.8)} 0,${-len} C${r1(-wid*.55)},${r1(-len*.8)} ${r1(-wid*.55)},${r1(-len*.25)} 0,0Z" fill="${col}" stroke="${st||dk(col,.55)}" stroke-width=".8"/><path d="M0,0 L0,${r1(-len*.85)}" stroke="${dk(col,.62)}" stroke-width=".6"/></g>`;
const flame=(x,y,s=1,off=0)=>`<g ${an('flick',.7+off*.13,'transform-box:fill-box;transform-origin:50% 100%',off)}><path d="M${x},${y} C${x-3.6*s},${y-3*s} ${x-2.4*s},${y-7*s} ${x},${y-10*s} C${x+2.4*s},${y-7*s} ${x+3.6*s},${y-3*s} ${x},${y}Z" fill="#ffab3d"/><path d="M${x},${y} C${x-1.8*s},${y-2*s} ${x-1.2*s},${y-4*s} ${x},${y-6*s} C${x+1.2*s},${y-4*s} ${x+1.8*s},${y-2*s} ${x},${y}Z" fill="#fff0b0"/></g>`;
function pot(c,lx,ly,r,h,col){c.cyl(lx,ly,r,h,col);const[x,y]=c.S(lx,ly,h);c.raw(`<ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${r1(r*HW*1.414*.85)}" ry="${r1(r*HH*1.414*.85)}" fill="#3b2a20"/>`)}

const ov=(ax,ay,aw,ad,bx,by,bw,bd,p=0)=>ax<bx+bw-p&&ax+aw>bx+p&&ay<by+bd-p&&ay+ad>by+p;
function resolve(it){
  const d=DEF[it.t],[ew,ed]=ext(it);
  if(it.x<-1e-6||it.y<-1e-6||it.x+ew>N+1e-6||it.y+ed>N+1e-6)return{ok:false};
  const others=state.items.filter(o=>o!==it&&!o.wall&&!o.tmp&&o.parent!==it.id);
  if(d.small){
    const cx=it.x+ew/2,cy=it.y+ed/2;
    const par=others.find(o=>{const od=DEF[o.t];if(!od.surf||o.parent||(o.z||0)>0)return false;const[ow,oh]=ext(o);return cx>=o.x&&cx<=o.x+ow&&cy>=o.y&&cy<=o.y+oh});
    if(par){const[pw,ph]=ext(par);let x=it.x,y=it.y;
      if(ew<=pw)x=clamp(x,par.x,par.x+pw-ew);if(ed<=ph)y=clamp(y,par.y,par.y+ph-ed);
      for(const s of others.filter(o=>o.parent===par.id))if(ov(x,y,ew,ed,s.x,s.y,ext(s)[0],ext(s)[1],.08))return{ok:false};
      return{ok:true,z:DEF[par.t].surf,parent:par.id,x,y}}
  }
  if(d.flat)return{ok:true,z:0,parent:null,x:it.x,y:it.y};
  for(const o of others){const od=DEF[o.t];if(od.flat||o.parent||(o.z||0)>0)continue;const[ow,oh]=ext(o);if(ov(it.x,it.y,ew,ed,o.x,o.y,ow,oh,.06))return{ok:false}}
  return{ok:true,z:0,parent:null,x:it.x,y:it.y};
}
function wallOK(it){
  const d=DEF[it.t];
  if(it.u<-1e-6||it.u+d.ww>320+1e-6||it.v<4||it.v+d.wh>WH-12)return false;
  return !state.items.some(o=>o!==it&&o.wall&&!o.tmp&&o.side===it.side&&ov(it.u,it.v,d.ww,d.wh,o.u,o.v,DEF[o.t].ww,DEF[o.t].wh,.5));
}
function miniInfo(){
  const m=state.mini,cx=m.x+.25,cy=m.y+.25;
  const seat=state.items.find(o=>!o.wall&&!o.tmp&&DEF[o.t].seat&&(o.z||0)===0&&(()=>{const[w,h]=ext(o);return cx>=o.x&&cx<=o.x+w&&cy>=o.y&&cy<=o.y+h})());
  return{seat,z:seat?DEF[seat.t].seat-5:0};
}
function miniOK(m){
  if(m.x<0||m.y<0||m.x+.5>N||m.y+.5>N)return false;
  const cx=m.x+.25,cy=m.y+.25;
  return !state.items.some(o=>{if(o.wall||o.tmp||o.parent||(o.z||0)>0)return false;const d=DEF[o.t];if(d.flat||d.seat)return false;const[w,h]=ext(o);return ov(m.x+.08,m.y+.08,.34,.34,o.x,o.y,w,h)});
}
function toGrid(sx,sy,z){const a=(sx-OX)/HW,b=(sy-OY+z)/HH;return{x:(a+b)/2,y:(b-a)/2}}
function toWall(side,sx,sy){const u=(side==='L'?(OX-sx):(sx-OX))*WK/HW;return{u,v:sy-OY+WH-u*HH/WK}}
function placeFloorAt(it,sx,sy){
  const d=DEF[it.t],[ew,ed]=ext(it);
  if(d.small){
    const surfs=state.items.filter(o=>o!==it&&!o.wall&&!o.tmp&&DEF[o.t].surf&&!o.parent&&(o.z||0)===0).sort((a,b)=>(b.x+b.y)-(a.x+a.y));
    for(const o of surfs){const g=toGrid(sx,sy,DEF[o.t].surf),[ow,od]=ext(o);
      if(g.x>=o.x&&g.x<=o.x+ow&&g.y>=o.y&&g.y<=o.y+od){it.x=snap(g.x-ew/2,.5);it.y=snap(g.y-ed/2,.5);return}}
  }
  const g=toGrid(sx,sy,0),st=d.small?.5:1;
  it.x=clamp(snap(g.x-ew/2,st),0,Math.max(0,N-ew));it.y=clamp(snap(g.y-ed/2,st),0,Math.max(0,N-ed));
}
function placeWallAt(it,sx,sy){
  const d=DEF[it.t],side=sx<OX?'L':'R',p=toWall(side,sx,sy);
  it.side=side;it.u=clamp(snap(p.u-d.ww/2,5),0,320-d.ww);it.v=clamp(snap(p.v-d.wh/2,5),6,WH-12-d.wh);

function autoWall(t,silent){
  const d=DEF[t];
  const vs=t==='nowplaying'?[14,22,32]:[30,60,90];
  for(const side of (t==='nowplaying'?['L','R']:['R','L']))for(const v of vs)for(let u=0;u<=320-d.ww;u+=10){
    const it={t,wall:1,side,u,v};if(wallOK(it)){const n=wallItem(t,side,u,v);state.items.push(n);return n}}
  if(!silent)toast('벽에 빈 자리가 없어요');return null;
}
function autoFloor(t){
  const d=DEF[t],st=d.small?.5:1,c=[];
  for(let x=0;x<=N;x+=st)for(let y=0;y<=N;y+=st)c.push([x,y]);
  c.sort((a,b)=>Math.hypot(a[0]-3.5,a[1]-3.5)-Math.hypot(b[0]-3.5,b[1]-3.5));
  for(const pass of d.small?[1,0]:[0]){
    for(const[x,y]of c){const it=mk(t,{x,y});const r=resolve(it);if(!r.ok)continue;if(pass&&!r.parent)continue;
      Object.assign(it,{x:r.x,y:r.y,z:r.z,parent:r.parent});state.items.push(it);return it}}
  toast('방에 빈 자리가 없어요');return null;
}

function drawWall(it){

function sortFloor(list){
  const n=list.length,out=[],ind=new Array(n).fill(0),adj=Array.from({length:n},()=>[]);
  const info=list.map(o=>{if(o.kind==='mini'){return{x:o.x,y:o.y,w:.5,d:.5}}const[w,d]=ext(o);return{x:o.x,y:o.y,w:w,d:d}});
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(i===j)continue;const A=info[i],B=info[j],a=list[i],b=list[j];
    if(b.parent===a.id||(b.kind==='mini'&&b.seat===a.id)){adj[i].push(j);ind[j]++;continue}
    if(a.parent===b.id||(a.kind==='mini'&&a.seat===b.id)||a.parent&&a.parent===b.parent)continue;
    const sx=A.x+A.w<=B.x+1e-6,sy=A.y+A.d<=B.y+1e-6,rx=B.x+B.w<=A.x+1e-6,ry=B.y+B.d<=A.y+1e-6;
    if((sx||sy)&&!(rx||ry)){adj[i].push(j);ind[j]++}}
  const key=i=>info[i].x+info[i].w+info[i].y+info[i].d,done=new Array(n).fill(false);
  for(let k=0;k<n;k++){let best=-1;for(let i=0;i<n;i++)if(!done[i]&&ind[i]===0&&(best<0||key(i)<key(best)))best=i;
    if(best<0)for(let i=0;i<n;i++)if(!done[i]&&(best<0||key(i)<key(best)))best=i;
    done[best]=true;out.push(list[best]);adj[best].forEach(j=>ind[j]--)}
  return out;
}

function renderLP(){
  const s=$('#sLP');
  s.innerHTML=`<h2>LP장</h2><p>추천받은 곡이 LP로 꽂혀요. 눌러서 턴테이블에 올리면 오른쪽에서 영상이 재생돼요. 새 추천을 받으면 LP가 더 쌓여요.</p><div class="lps">`
   +LPS.map(l=>{const own=state.lps.includes(l.id);return `<button class="lp ${state.cur===l.id?'cur':''}" data-l="${l.id}" ${own?'':'disabled'}><span class="disc" style="--c:${l.color}"></span><span><b>${l.cn}</b><small>${l.title}${l.who?' · '+l.who:''}</small></span></button>`}).join('')
   +`</div><div class="foot"><button class="btn" id="lpOut" ${state.cur?'':'disabled'}>LP 빼기</button><button class="btn pri" id="lpX">닫기</button></div>`;
}
$('#sLP').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.l)chooseLP(b.dataset.l);
  else if(b.id==='lpUn')unlockNext();
  else if(b.id==='lpOut'){state.cur=null;state.playing=false;stopAudio();save();render();renderLP()}
  else if(b.id==='lpX')closeModals();
});
function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'))}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('pointerdown',e=>{if(e.target===m)closeModals()}));
/* ---- 미니미 설정 ---- */
function openMini(){renderMini();$('#mMini').classList.add('on')}
$('#bMini').addEventListener('click',openMini);
function renderMini(){
  const m=state.mini,dots=(arr,key)=>arr.map((c,i)=>`<button class="dot ${m[key]===i?'on':''}" data-k="${key}" data-v="${i}" style="background:${c}" aria-label="${key} ${i+1}"></button>`).join('');
  $('#sMini').innerHTML=`<h2>미니미 꾸미기</h2><p>방 안에서 끌어서 움직일 수 있어요. 계절에 따라 춥거나 더우면 말을 걸어요.</p>
   <div class="row"><span>머리 모양</span>${['단발','긴 머리','올림 머리'].map((n,i)=>`<button class="chip ${m.style===i?'on':''}" data-k="style" data-v="${i}">${n}</button>`).join('')}</div>
   <div class="row"><span>머리색</span>${dots(HAIR,'hair')}</div><div class="row"><span>옷 색</span>${dots(SHIRT,'shirt')}</div><div class="row"><span>피부색</span>${dots(SKIN,'skin')}</div>
   <div class="foot"><button class="btn pri" id="mX">닫기</button></div>`;
}
$('#sMini').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='mX'){closeModals();return}
  if(b.dataset.k){state.mini[b.dataset.k]=+b.dataset.v;save();render();renderMini()}
});
/* ---- 안내문 ---- */
let tt=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

function hangFrames(){let n=0;state.lps.forEach(id=>{const l=lpOf(id);if(!l||n>=3||!DEF['frame_'+l.comp])return;if(state.items.some(i=>i.t==='frame_'+l.comp)){n++;return}if(autoWall('frame_'+l.comp,true))n++})}
/* ---- 추천곡 → LP 서재 (이 기기에 쌓여요) ---- */
const hsl=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return rg([f(0)*255,f(8)*255,f(4)*255])};
function hashS(t){let h=7;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return h}
function loadLib(){try{const a=JSON.parse(localStorage.getItem(LIBKEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function setRecs(recs){
  if(!Array.isArray(recs))return;
  const fresh=recs.filter(r=>r&&r.en).map(r=>{const id='r'+hashS(r.en).toString(36),k=COMP[r.cid];
    return{id,comp:r.cid,cn:r.cn||(k?k.n:''),title:r.ko||r.en,who:r.who||'',era:'',color:k?LPS_COLOR[r.cid]||hsl(hashS(r.cid)%360,38,56):hsl(hashS(r.cid||'x')%360,38,56),yt:r.yt?[r.yt]:[]}});
  if(!fresh.length)return;
  const ids=new Set(fresh.map(f=>f.id)),old=loadLib().filter(o=>!ids.has(o.id));
  const lib=fresh.concat(old).slice(0,16);
  try{localStorage.setItem(LIBKEY,JSON.stringify(lib))}catch(e){}
  applyLib(lib);
}
const LPS_COLOR={bach:'#c9a15a',pachelbel:'#e0c6a0',mozart:'#7aa6c8',beethoven:'#9a3248',chopin:'#b9bfd0',debussy:'#8aa070',tchaikovsky:'#c4505c'};
function applyLib(lib){
  LPS=lib.slice();state.lps=LPS.map(l=>l.id);
  if(!state.cur||!lpOf(state.cur)){state.cur=LPS[0]?LPS[0].id:null;state.playing=false}
  hangFrames();save();render();
  if(document.querySelector('#mLP.on'))renderLP();
}
window.addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object')return;
  if(d.yc==='recs')setRecs(d.recs);
  else if(d.yc==='stop'&&state.playing){state.playing=false;stopAudio();save();render()}
});
function tellParent(m){try{if(EMB)parent.postMessage(Object.assign({yc:'room'},m),'*')}catch(e){}}
/* ================= 시작 ================= */
if(EMB){const lib=loadLib();LPS=lib.slice()}
if(!load()){
  const k=state.season==='winter'||state.night?'romantic':'classic';
  const p=PRESETS[k];state.wall=p.wall;state.floor=p.floor;state.items=p.list();state.lps=LPS.map(l=>l.id);state.mini={...state.mini,x:p.mini[0],y:p.mini[1]};
  hangNP(true,true);hangFrames();ensureFixed();
}
state.lps=LPS.map(l=>l.id);if(!state.cur||!lpOf(state.cur))state.cur=null;if(!state.cur&&LPS[0])state.cur=LPS[0].id;state.playing=false;
syncHead();renderTabs();renderGrid();render();tellParent({ready:1});
setInterval(()=>{if(!DRAG&&!document.querySelector('.modal.on'))render()},20000);
window.__room={state,render,DEF,applyPreset};
})();
</script>
</body>
</html>
