<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>냠냠클래식 미니룸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 방향: 와인 빛 어두운 서재 + 호박색 포인트. 단일 테마. 좌측 방 무대, 우측 아이템 서랍. */
:root{
  --bg:#171012; --bg2:#21171a; --panel:#2a1e22; --line:#4b393e;
  --ink:#f3e7d7; --mute:#b7a596; --amber:#e8b45a; --wine:#9a3248;
  --ok:#7bc98f; --bad:#e2655b;
  --display:'Gowun Batang',serif; --body:'Gowun Dodum',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
body{overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
main,#side,#ytw,#panel,header,footer#dock{min-width:0}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--display);font-size:20px;margin:0;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--mute)}
.grp{display:flex;align-items:center;gap:6px}
.grp>label{font-size:12px;color:var(--mute);margin-right:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 10px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--amber);color:#2a1a0c}
.seg button:hover:not(.on){background:#3a2a2f}
.btn{background:#3a2a2f;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--amber)}
.btn.pri{background:var(--amber);color:#2a1a0c;border-color:var(--amber)}
.btn:disabled{opacity:.4;cursor:not-allowed}
main{display:flex;min-height:0}
#stage{position:relative;overflow:hidden;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#2c1d22 0%,#171012 70%)}
#roombg{position:absolute;inset:0;width:100%;height:100%;filter:blur(18px) brightness(.5) saturate(1.1);transform:scale(1.15);pointer-events:none}
#room{position:relative;filter:contrast(1.12) saturate(1.22);width:100%;height:100%;max-height:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none;display:block}
#room .it{cursor:grab;touch-action:pan-y;-webkit-touch-callout:none}
#playBtn{position:absolute;left:10px;top:10px;z-index:3;min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--amber);background:var(--amber);color:#2a1a0c;font-size:16px;font-weight:700;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.45)}
#playBtn.on{background:rgba(23,16,18,.88);color:var(--amber)}
#playBtn.wait{background:rgba(23,16,18,.88);color:var(--ink);border-color:var(--line)}
#hint{top:66px!important}
#ythint{display:none;margin:0;padding:8px 10px;font-size:13.5px;line-height:1.45;color:#2a1a0c;background:var(--amber)}#ythint.on{display:block}
#zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
#zoom button{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:rgba(23,16,18,.85);font-size:18px;line-height:1}
#zoom button:disabled{opacity:.35}
#zoom #zFull{width:auto;height:40px;padding:0 14px;font-size:15px;font-weight:700;line-height:1;white-space:nowrap;border-color:var(--amber);color:var(--amber)}
#stage:fullscreen,#stage:-webkit-full-screen{flex:none;width:100vw;height:100vh;aspect-ratio:auto}
#stage.fs{position:fixed;inset:0;z-index:50;flex:none;width:100%;height:100%;aspect-ratio:auto}
#stage:fullscreen #hint,#stage.fs #hint{display:block}
#fab{display:none;position:absolute;left:8px;right:8px;bottom:8px;z-index:4;flex-wrap:wrap;gap:6px 8px;align-items:center;justify-content:center;padding:8px 10px;border-radius:14px;background:rgba(23,16,18,.92);border:1px solid var(--line)}
@media (max-width:820px),(pointer:coarse){#fab.on{display:flex}}#fab .sel{font-size:13px;margin-right:4px}#fab .sel small{display:none}
#fab .btn{min-height:40px;font-size:14px;padding-left:14px;padding-right:14px}
#side{width:372px;flex:none;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
#ytw{display:none;flex:none;background:#0d0a0a;border-bottom:1px solid var(--line)}#ytw.on{display:block}
.yth{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12px;color:var(--mute)}.yth span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.yth button,.yth a{background:#3a2a2f;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11.5px;color:var(--ink);text-decoration:none;white-space:nowrap}
#ytbox{position:relative;aspect-ratio:16/9;background:#000}#ytbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yterr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--mute);text-align:center;padding:10px}
.yterr a{color:var(--amber)}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);
  padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#hint{position:absolute;left:12px;top:10px;font-size:12px;color:var(--mute);max-width:46%;line-height:1.5;pointer-events:none}
#panel{flex:1;background:var(--panel);display:flex;flex-direction:column;min-height:0}
#tip{display:none;margin:0;padding:9px 12px;font-size:12.5px;line-height:1.5;color:var(--mute);border-bottom:1px solid var(--line)}#tip b{color:var(--amber);font-weight:400}
.card.pick{border-color:var(--amber);background:#42302a}
#tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px;border-bottom:1px solid var(--line)}
#tabs button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px}
#tabs button.on{background:var(--wine);border-color:var(--wine)}
#grid{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.card{background:#35262b;border:1px solid var(--line);border-radius:10px;padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;
  touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card:hover{border-color:var(--amber)}
.card svg{width:100%;height:64px}
.card b{font-weight:400;font-size:11.5px;text-align:center;line-height:1.25}
.card.fixed b::after{content:" · 고정";color:var(--amber)}
.sw{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px;border:1px solid var(--line);background:#35262b;font-size:12.5px;text-align:left}
.sw i{width:26px;height:26px;border-radius:6px;border:1px solid #0006;flex:none}
.sw.on{border-color:var(--amber)}
.sect{grid-column:1/-1;font-size:12px;color:var(--mute);margin:6px 2px 0}
footer#dock{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);background:var(--bg2);min-height:52px}
#dock .sel{font-size:14px;margin-right:auto}
#dock .sel small{color:var(--mute);margin-left:8px}
#now{font-size:13px;color:var(--amber)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;max-height:90%;overflow:auto;padding:18px}
.sheet h2{font-family:var(--display);margin:0 0 4px;font-size:19px}
.sheet p{margin:0 0 12px;color:var(--mute);font-size:13px}
.lps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.lp{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#35262b;text-align:left}
.lp:hover:not(:disabled){border-color:var(--amber)}
.lp.cur{border-color:var(--amber);background:#42302a}
.lp:disabled{opacity:.45;cursor:not-allowed}
.disc{width:68px;height:68px;border-radius:50%;flex:none;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.lp.cur .disc{animation:spin 7s linear infinite}
.lpnow{display:inline-block;font-style:normal;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--amber);color:#2a1a10;font-size:10.5px;vertical-align:1px}
.lp b{display:block;font-weight:400;font-size:14px}
.lp small{color:var(--mute);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.row>span{width:64px;font-size:12.5px;color:var(--mute)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid #0006}
.dot.on{outline:2px solid var(--amber);outline-offset:2px}
.chip{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:#35262b;font-size:13px}
.chip.on{background:var(--amber);color:#2a1a0c;border-color:var(--amber)}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
@media (max-width:820px){
  /* 모바일(2026-11-19): 틀 높이가 고정이라 문서는 스크롤하지 않음. 위에서부터 세팅 한 줄 → 유튜브 상단바 → 방 → 가구 서랍(서랍만 안에서 스크롤) */
  html,body{overflow:hidden;height:100%}
  #app{height:100%;display:flex;flex-direction:column}
  main,#side{display:contents}
  header{order:0;flex:none;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:8px 10px;gap:8px}
  header::-webkit-scrollbar{display:none}
  .brand{display:none}
  header .grp{flex:none;flex-wrap:nowrap}
  #ytw{order:1}
  #ytw.on{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-areas:"box head" "hint hint"}
  #ytbox{grid-area:box}
  .yth{grid-area:head;flex-wrap:wrap;align-content:center;gap:6px;padding:6px 8px}
  .yth span{flex:1 1 100%;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px;line-height:1.35}
  .yth button,.yth a{font-size:12.5px;padding:6px 9px}
  #ythint{grid-area:hint}
  #stage{order:2;flex:none;aspect-ratio:662/535;width:100%}
  #panel{order:3;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
  #grid{overflow:visible;flex:none}
  #grid{grid-template-columns:repeat(4,1fr)}
  #hint{display:none}
  footer#dock{display:none}
  .grp>label{display:none}
  .seg button{padding-left:10px;padding-right:10px}
  .btn,.seg button{white-space:nowrap}
}
@media (max-width:820px),(pointer:coarse){
  #tip{display:block}
  .btn,.seg button{min-height:42px;font-size:14.5px;padding-left:14px;padding-right:14px}
  #dock{gap:10px}
  #dock .btn{min-height:46px;font-size:15px;padding-left:18px;padding-right:18px}
  #tabs button{padding:8px 13px;font-size:13.5px}
}
@media (max-width:520px){ #grid{grid-template-columns:repeat(3,1fr)} .lps{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ #room *{animation:none!important} }
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* 방 애니메이션 */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes flick{0%,100%{transform:scale(1,1)}25%{transform:scale(.9,1.12)}50%{transform:scale(1.08,.9)}75%{transform:scale(.94,1.08)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes shiver{0%,100%{transform:translateX(-.9px)}50%{transform:translateX(.9px)}}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes note{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(10px,-34px);opacity:0}}
@keyframes tick{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
@keyframes wind{0%{transform:translateY(0);opacity:0}30%{opacity:.9}100%{transform:translateY(16px);opacity:0}}
@keyframes fall{0%{transform:translate(0,-12px)}100%{transform:translate(8px,110px)}}
@keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-10px);opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><h1>나의 미니룸</h1><span>추천받은 곡이 LP로 꽂혀요</span></div>
    <div class="grp"><label>처음 세팅</label>
      <div class="seg" id="presets"><button data-p="baroque">바로크방</button><button data-p="classic">고전방</button><button data-p="romantic">낭만방</button></div></div>
    <div class="grp"><label>계절</label>
      <div class="seg" id="seasons"><button data-s="spring">봄</button><button data-s="summer">여름</button><button data-s="autumn">가을</button><button data-s="winter">겨울</button></div></div>
    <div class="grp"><label>시간</label>
      <div class="seg" id="times"><button data-t="day">낮</button><button data-t="night">밤</button></div></div>
    <div class="grp"><button class="btn" id="bUndo" disabled title="되돌리기 (Ctrl+Z)">↶ 되돌리기</button><button class="btn" id="bMini">미니미 꾸미기</button><button class="btn" id="bBak">방 저장·불러오기</button></div>
  </header>
  <main>
    <section id="stage">
      <svg id="roombg" viewBox="22 12 662 535" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
      <svg id="room" viewBox="22 12 662 535" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="미니룸"></svg>
      <div id="hint">서랍에서 아이템을 끌어다 놓거나 눌러서 추가하세요. 방 안의 아이템은 끌어서 옮기고, 선택하면 아래에서 돌리거나 뺄 수 있어요.</div>
      <button id="playBtn" type="button">▶ 음악 듣기</button><div id="zoom"><button id="zFull" aria-label="전체화면" title="전체화면">전체화면</button><button id="zIn" aria-label="확대">＋</button><button id="zOut" aria-label="축소" disabled>－</button></div><div id="fab"></div><div id="toast"></div>
    </section>
    <div id="side"><div id="ytw"><div class="yth"><span id="ytt"></span><button id="ytn">다른 영상</button><a id="yta" target="_blank" rel="noopener">유튜브에서 열기</a><button id="ytx" aria-label="닫기">✕</button></div><p id="ythint">소리가 안 나오나요? 위의 ‘▶ 여기를 눌러 재생’이나 아래 영상 가운데 ▶ 버튼을 눌러 주세요.</p><div id="ytbox"><div id="ytp"></div></div></div><aside id="panel"><p id="tip">가구 카드를 <b>한 번 터치</b>하면 방에 들어가요. 방 안의 가구는 <b>살짝 길게 누른 뒤</b> 끌어서 옮길 수 있어요. 빈 곳이나 가구를 스치듯 밀면 화면이 스크롤돼요.</p><nav id="tabs"></nav><div id="grid"></div></aside></div>
  </main>
  <footer id="dock"></footer>
</div>

<div class="modal" id="mLP"><div class="sheet" id="sLP"></div></div>
<div class="modal" id="mMini"><div class="sheet" id="sMini"></div></div>
<div class="modal" id="mBak"><div class="sheet" id="sBak"></div></div>

<script>
(()=>{
'use strict';
/* ================= 기본 상수·도우미 ================= */
const HW=40,HH=20,N=8,OX=350,OY=210,WH=190,WK=40;
const P=(x,y,z=0)=>[OX+(x-y)*HW,OY+(x+y)*HH-z];
const r1=v=>Math.round(v*10)/10;
const pts=a=>a.map(p=>r1(p[0])+','+r1(p[1])).join(' ');
const hx=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const rg=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const dk=(h,f)=>rg(hx(h).map(v=>v*f));
const lg=(h,f)=>rg(hx(h).map(v=>v+(255-v)*f));
const poly=(a,fill,st='none',sw=1)=>`<polygon points="${pts(a)}" fill="${fill}" stroke="${st}" stroke-width="${sw}" stroke-linejoin="round"/>`;
const R=(x,y,w,h,fill,ex='')=>`<rect x="${r1(x*100)/100}" y="${r1(y*100)/100}" width="${w}" height="${h}" fill="${fill}" ${ex}/>`;
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const range=(a,b,s)=>{const o=[];for(let v=a;v<b;v+=s)o.push(v);return o};
const snap=(v,s)=>Math.round(v/s)*s;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=s=>document.querySelector(s);
const COARSE=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
const T0=performance.now();
const tnow=()=>(performance.now()-T0)/1000;

/* 렌더 중 공유되는 값 */
const Q={season:'autumn',night:false,preview:false,gl:[],cur:null,playing:false};
function an(name,per,extra='',off=0,timing='linear'){
  if(Q.preview)return extra?`style="${extra}"`:'';
  return `style="animation:${name} ${per}s ${timing} infinite;animation-delay:-${((tnow()+off)%per).toFixed(2)}s;${extra}"`;
}

/* ================= 곡 데이터 ================= */
const COMP={
  bach:{n:'바흐',fr:'#8c6a3a',bg:'#6e8f9a'},
  pachelbel:{n:'파헬벨',fr:'#a9824a',bg:'#9a8a6a'},
  mozart:{n:'모차르트',fr:'#d6b25e',bg:'#a7c4d8'},
  beethoven:{n:'베토벤',fr:'#3b2a22',bg:'#7a6a58'},
  chopin:{n:'쇼팽',fr:'#c9ccd2',bg:'#5a5f78'},
  debussy:{n:'드뷔시',fr:'#7a8a62',bg:'#c9a78a'},
  tchaikovsky:{n:'차이콥스키',fr:'#a33a46',bg:'#8a98b0'}
};
function seqBach(){
  const bars=[[60,64,67,72,76],[60,62,69,74,77],[59,62,67,74,77],[60,64,67,72,76],[60,64,69,76,81],[60,62,66,69,74],[59,62,67,74,79],[59,60,64,67,72]];
  const ev=[];
  bars.forEach((b,i)=>{const s=i*16;ev.push([s,b[0]-12,15,.2]);const pat=[b[0],b[1],b[2],b[3],b[4],b[2],b[3],b[4]];for(let k=0;k<16;k++)ev.push([s+k,pat[k%8],3.4,.17]);});
  return{ev,len:136};
}
function seqPachelbel(){
  const bass=[50,45,47,42,43,50,43,45];
  const ch=[[62,66,69],[57,61,64],[59,62,66],[54,57,61],[55,59,62],[62,66,69],[55,59,62],[57,61,64]];
  const mel=[78,76,74,73,71,69,71,73];
  const ev=[];
  for(let r=0;r<2;r++)for(let i=0;i<8;i++){
    const s=(r*8+i)*2,c=ch[i];
    ev.push([s,bass[i],2,.2]);
    [c[0],c[1],c[2],c[1]].forEach((n,k)=>ev.push([s+k*.5,n+(r?12:0),1.6,.1]));
    ev.push([s,mel[i]+(r?0:0),2.2,.2]);
  }
  return{ev,len:34};

function seqMozart(){

const GROW_AT=[0,1,2,4,7],GROW_N=['싹이 났어요','어린잎이 나요','쑥쑥 자라요','꽃봉오리가 맺혔어요','꽃이 활짝 폈어요'];
const growStage=()=>{let g=0;GROW_AT.forEach((n,i)=>{if(state.grow.d>=n)g=i});return g};
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function growMsg(){const g=growStage(),k=dayKey(),done=state.grow.a===k,t=todayT(),nx=GROW_AT[g+1];
  return GROW_N[g]+' · 음악을 들려주면 자라요 · '+(done?'오늘 물 주기 완료':'오늘 '+Math.min(60,t)+'/60초')+(nx?' · '+(nx-state.grow.d)+'일 더 오면 다음 단계':'')}

function winView(x,y,w,h,pre){
  const s=Q.season,n=Q.night,id='cw'+pre;
  const sk=n?['#0b1230','#1d2a5a']:{spring:['#bfe3f4','#f7e6f0'],summer:['#4fb0ec','#bfe6ff'],autumn:['#f3c996','#fbe9c7'],winter:['#b9c8d8','#e6eef5']}[s];
  const hill={spring:'#8fc27a',summer:'#4f9a4c',autumn:'#b0793a',winter:'#eef3f8'}[s],can={spring:'#f2a3c0',summer:'#3f8f45',autumn:'#e8742a',winter:'#cfdbe6'}[s];
  const H=n?dk(hill,.4):hill,C=n?dk(can,.45):can;
  let o=`<clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath><g clip-path="url(#${id})">`;
  o+=R(x,y,w,h/2,sk[0])+R(x,y+h/2,w,h/2,sk[1]);
  if(n){const rnd=mul(3);for(let i=0;i<14;i++)o+=`<circle cx="${r1(x+rnd()*w)}" cy="${r1(y+rnd()*h*.6)}" r="${r1(.5+rnd()*.8)}" fill="#fff"/>`;o+=`<circle cx="${x+w*.72}" cy="${y+h*.26}" r="6.5" fill="#f6f1d0"/><circle cx="${x+w*.72+3}" cy="${y+h*.26-1}" r="5.6" fill="#0f1a3e"/>`}
  else{o+=`<circle cx="${x+w*.76}" cy="${y+h*.24}" r="6" fill="#ffe27a"/>`;if(s!=='winter')o+=`<ellipse cx="${x+w*.3}" cy="${y+h*.22}" rx="11" ry="4" fill="#fff" opacity=".85"/><ellipse cx="${x+w*.42}" cy="${y+h*.28}" rx="8" ry="3" fill="#fff" opacity=".8"/>`}
  o+=`<path d="M${x},${y+h*.72} Q${x+w*.3},${y+h*.55} ${x+w*.6},${y+h*.7} T${x+w},${y+h*.66} L${x+w},${y+h} L${x},${y+h}Z" fill="${H}"/>`;
  const tx=x+w*.28,ty=y+h*.78;
  o+=`<rect x="${tx-1.6}" y="${ty-22}" width="3.2" height="24" fill="${n?'#2a1f18':'#6b4a30'}"/>`;
  if(s==='winter')o+=`<path d="M${tx},${ty-22} l-9,-9 M${tx},${ty-16} l9,-8 M${tx},${ty-26} l5,-8" stroke="${n?'#2a1f18':'#6b4a30'}" stroke-width="1.6"/><circle cx="${tx-9}" cy="${ty-32}" r="2" fill="#fff"/><circle cx="${tx+9}" cy="${ty-25}" r="2" fill="#fff"/>`;
  else o+=`<circle cx="${tx}" cy="${ty-26}" r="11" fill="${C}"/><circle cx="${tx-8}" cy="${ty-20}" r="8" fill="${C}"/><circle cx="${tx+8}" cy="${ty-20}" r="8" fill="${C}"/>`;
  if(!Q.preview){const pc={spring:'#f7b6cf',autumn:'#e8742a',winter:'#ffffff'}[s];
    if(pc&&!n||(n&&s==='winter')){const rnd=mul(9);for(let i=0;i<7;i++)o+=`<circle cx="${r1(x+rnd()*w)}" cy="${r1(y)}" r="${s==='winter'?1.6:2}" fill="${pc}" style="animation:fall ${5+rnd()*3}s linear infinite;animation-delay:-${((tnow()+i*1.3)%6).toFixed(2)}s"/>`}}
  return o+'</g>';
}

{const d=new Date(),m=d.getMonth()+1,h=d.getHours();state.season=m>=3&&m<=5?'spring':m>=6&&m<=8?'summer':m>=9&&m<=11?'autumn':'winter';state.night=false}
let MIG=0;const EMB=window.parent!==window,LIBKEY='nyamnyam-room-lib-v1',KEY='nyamnyam-miniroom-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({wall:state.wall,floor:state.floor,items:state.items.filter(i=>!i.tmp),mini:state.mini,lps:state.lps,cur:state.cur,grow:state.grow,seq,sv:2}))}catch(e){}}
const UNDO=[];
function snapS(){return JSON.stringify({wall:state.wall,floor:state.floor,items:state.items.filter(i=>!i.tmp),mini:state.mini,cur:state.cur,seq})}
function pushU(s){if(!s)return;if(UNDO.length&&UNDO[UNDO.length-1]===s)return;UNDO.push(s);if(UNDO.length>40)UNDO.shift();updUndo()}
function updUndo(){const b=document.getElementById('bUndo');if(b)b.disabled=!UNDO.length}
function undo(){
  const s=UNDO.pop();updUndo();if(!s){toast('되돌릴 게 없어요');return}
  const j=JSON.parse(s);state.wall=j.wall;state.floor=j.floor;state.items=j.items.filter(i=>DEF[i.t]);state.mini=Object.assign({},state.mini,j.mini);state.cur=j.cur&&lpOf(j.cur)?j.cur:state.cur;seq=Math.max(seq,j.seq||0);
  state.sel=null;ensureFixed();save();render();renderGrid();toast('방금 한 일을 되돌렸어요');ev('undo')

function ev(n,p){try{if(EMB)parent.postMessage({yc:'room',ev:n,p:p||{}},location.origin)}catch(e){}}

function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(!j||!Array.isArray(j.items))return false;
  state.wall=j.wall;state.floor=j.floor;state.items=j.items.filter(i=>DEF[i.t]);state.mini=Object.assign(state.mini,j.mini);state.cur=j.cur||null;setGrow(j.grow);seq=j.seq||seq+100;ensureFixed();if((j.sv|0)<2)MIG=1;return true}catch(e){return false}}
function setGrow(g){if(g&&typeof g==='object')state.grow={d:g.d|0,t:g.t|0,k:String(g.k||''),a:String(g.a||''),init:g.init|0,x:Array.isArray(g.x)?g.x.filter(v=>typeof v==='string').slice(-30):(g.a?[String(g.a)]:[])}}
const ext=it=>{const d=DEF[it.t];return (it.f&1)?[d.d,d.w]:[d.w,d.d]};
function mk(t,o){return Object.assign({id:nid(),t,x:0,y:0,f:0,z:0,parent:null},o)}
function ensureFixed(){
  if(!state.items.some(i=>i.t==='turntable'))state.items.push(mk('turntable',{x:3,y:0}));

/* 목록 카드에서 들은 시간(assets/lp.js → yc-listen-v1)도 같이 쳐 줘요. 지난 날은 카드에서만 60초 넘게 들은 날도 하루로 셉니다. */
const extListen=()=>{try{const m=JSON.parse(localStorage.getItem('yc-listen-v1')||'{}');return m&&typeof m==='object'?m:{}}catch(e){return{}}};
const todayT=()=>{const g=state.grow,k=dayKey();return (g.k===k?g.t:0)+((extListen()[k])|0)};
function water(day,msg){const g=state.grow;if(g.a===day||g.x.includes(day))return false;g.x.push(day);g.x=g.x.slice(-30);if(day===dayKey())g.a=day;g.d++;save();render();
  if(msg)toast((msg===2?'목록에서 들은 음악으로 ':'')+'물을 흠뻑 줬어요 · 화분이 '+(GROW_AT.includes(g.d)?'한 단계 자랐어요':'조금 더 컸어요'));return true}
function growCheck(){const k=dayKey(),m=extListen();let n=0;
  Object.keys(m).forEach(d=>{if(d!==k&&(m[d]|0)>=60&&water(d,0))n++});
  if(todayT()>=60&&water(k,state.playing?1:2))return;
  if(n)toast('목록에서 들은 음악으로 화분이 '+n+'번 물을 마셨어요')}
setInterval(()=>{const g=state.grow,k=dayKey();if(g.k!==k){g.k=k;g.t=0}
  if(state.playing&&!document.hidden){g.t+=5;if(g.t%30===0)save()}
  if(!document.hidden)growCheck()},5000);
function wallItem(t,side,u,v){return {id:nid(),t,wall:1,side,u,v}}
/* LP장을 턴테이블 바로 옆 빈자리로 (이미 붙어 있으면 그대로) */
function shelfBeside(){
  const tt=state.items.find(i=>i.t==='turntable'),sh=state.items.find(i=>i.t==='lpshelf');if(!tt||!sh)return false;
  const[tw,td]=ext(tt),f=(tt.f|0)%2,o={x:sh.x,y:sh.y,f:sh.f};
  const near=()=>{const[w,d]=ext(sh);return ov(sh.x,sh.y,w,d,tt.x-.3,tt.y-.3,tw+.6,td+.6)};
  if(near()&&typeof resolve==='function'&&resolve(sh).ok)return true;
  const cand=f?[[tt.x,tt.y+td],[tt.x,tt.y-2]]:[[tt.x+tw,tt.y],[tt.x-2,tt.y]];
  for(const[x,y]of cand){sh.x=x;sh.y=y;sh.f=f;if(resolve(sh).ok)return true}
  sh.x=o.x;sh.y=o.y;sh.f=o.f;return false;
}

const ov=(ax,ay,aw,ad,bx,by,bw,bd,p=0)=>ax<bx+bw-p&&ax+aw>bx+p&&ay<by+bd-p&&ay+ad>by+p;
function resolve(it){
  const d=DEF[it.t],[ew,ed]=ext(it);
  if(it.x<-1e-6||it.y<-1e-6||it.x+ew>N+1e-6||it.y+ed>N+1e-6)return{ok:false};
  const others=state.items.filter(o=>o!==it&&!o.wall&&!o.tmp&&o.parent!==it.id);
  if(d.small){
    const cx=it.x+ew/2,cy=it.y+ed/2;
    const par=others.find(o=>{const od=DEF[o.t];if(!od.surf||o.parent||(o.z||0)>0)return false;const[ow,oh]=ext(o);return cx>=o.x&&cx<=o.x+ow&&cy>=o.y&&cy<=o.y+oh});
    if(par){const[pw,ph]=ext(par);let x=it.x,y=it.y;
      if(ew<=pw)x=clamp(x,par.x,par.x+pw-ew);if(ed<=ph)y=clamp(y,par.y,par.y+ph-ed);
      for(const s of others.filter(o=>o.parent===par.id))if(ov(x,y,ew,ed,s.x,s.y,ext(s)[0],ext(s)[1],.08))return{ok:false};
      return{ok:true,z:DEF[par.t].surf,parent:par.id,x,y}}
  }
  if(d.flat)return{ok:true,z:0,parent:null,x:it.x,y:it.y};
  for(const o of others){const od=DEF[o.t];if(od.flat||o.parent||(o.z||0)>0)continue;const[ow,oh]=ext(o);if(ov(it.x,it.y,ew,ed,o.x,o.y,ow,oh,.06))return{ok:false}}
  return{ok:true,z:0,parent:null,x:it.x,y:it.y};
}
function wallOK(it){
  const d=DEF[it.t];
  if(it.u<-1e-6||it.u+d.ww>320+1e-6||it.v<4||it.v+d.wh>WH-12)return false;
  return !state.items.some(o=>o!==it&&o.wall&&!o.tmp&&o.side===it.side&&ov(it.u,it.v,d.ww,d.wh,o.u,o.v,DEF[o.t].ww,DEF[o.t].wh,.5));
}
function miniInfo(){
  const m=state.mini,cx=m.x+.25,cy=m.y+.25;
  const seat=state.items.find(o=>!o.wall&&!o.tmp&&DEF[o.t].seat&&(o.z||0)===0&&(()=>{const[w,h]=ext(o);return cx>=o.x&&cx<=o.x+w&&cy>=o.y&&cy<=o.y+h})());
  return{seat,z:seat?DEF[seat.t].seat-5:0};
}
function miniOK(m){

  const cx=m.x+.25,cy=m.y+.25;

}

function placeFloorAt(it,sx,sy){

function autoWall(t,silent){

  for(const side of (t==='nowplaying'?['L','R']:['R','L']))for(const v of vs)for(let u=0;u<=320-d.ww;u+=10){
    const it={t,wall:1,side,u,v};if(wallOK(it)){const n=wallItem(t,side,u,v);state.items.push(n);return n}}

function autoFloor(t){
  const d=DEF[t],st=d.small?.5:1,c=[];
  for(let x=0;x<=N;x+=st)for(let y=0;y<=N;y+=st)c.push([x,y]);
  c.sort((a,b)=>Math.hypot(a[0]-3.5,a[1]-3.5)-Math.hypot(b[0]-3.5,b[1]-3.5));
  for(const pass of d.small?[1,0]:[0]){
    for(const[x,y]of c){const it=mk(t,{x,y});const r=resolve(it);if(!r.ok)continue;if(pass&&!r.parent)continue;
      Object.assign(it,{x:r.x,y:r.y,z:r.z,parent:r.parent});state.items.push(it);return it}}

function sortFloor(list){
  const n=list.length,out=[],ind=new Array(n).fill(0),adj=Array.from({length:n},()=>[]);
  const info=list.map(o=>{if(o.kind==='mini'){return{x:o.x,y:o.y,w:.5,d:.5}}const[w,d]=ext(o);return{x:o.x,y:o.y,w:w,d:d}});
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(i===j)continue;const A=info[i],B=info[j],a=list[i],b=list[j];
    if(b.parent===a.id||(b.kind==='mini'&&b.seat===a.id)){adj[i].push(j);ind[j]++;continue}
    if(a.parent===b.id||(a.kind==='mini'&&a.seat===b.id)||a.parent&&a.parent===b.parent)continue;
    const sx=A.x+A.w<=B.x+1e-6,sy=A.y+A.d<=B.y+1e-6,rx=B.x+B.w<=A.x+1e-6,ry=B.y+B.d<=A.y+1e-6;
    if((sx||sy)&&!(rx||ry)){adj[i].push(j);ind[j]++}}
  const key=i=>info[i].x+info[i].w+info[i].y+info[i].d,done=new Array(n).fill(false);
  for(let k=0;k<n;k++){let best=-1;for(let i=0;i<n;i++)if(!done[i]&&ind[i]===0&&(best<0||key(i)<key(best)))best=i;
    if(best<0)for(let i=0;i<n;i++)if(!done[i]&&(best<0||key(i)<key(best)))best=i;
    done[best]=true;out.push(list[best]);adj[best].forEach(j=>ind[j]--)}
  return out;
}

const KEYS=Object.keys(D).filter(k=>k.length>=2).sort((x,y)=>y.length-x.length);
function t(v){if(D[v]!==undefined)return D[v];for(const[r,f]of R){const m=r.exec(v);if(m)return f(m)}
  let o=v;for(const k of KEYS)if(o.indexOf(k)>=0)o=o.split(k).join(D[k]);
  return o.replace(/(\d+)월/g,(_,n)=>MON[(+n-1)%12]||n).replace(/(\d+)번/g,'No. $1')}
const H=/[가-힣]/;
function pass(){
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){const v=n.nodeValue;if(!H.test(v))continue;const k=v.trim(),r=t(k);if(r!==k)n.nodeValue=v.replace(k,r)}
  document.querySelectorAll('[title],[aria-label],[placeholder]').forEach(e=>['title','aria-label','placeholder'].forEach(a=>{const v=e.getAttribute(a);if(v&&H.test(v)){const r=t(v);if(r!==v)e.setAttribute(a,r)}}));
}
const tip=document.getElementById('tip'),hint=document.getElementById('hint');
if(tip)tip.innerHTML='<b>Tap</b> a furniture card once to put it in the room. In the room, <b>press and hold briefly</b>, then drag to move it. Swipe over empty space or furniture to scroll the page.';
if(hint)hint.textContent='Drag items from the drawer into the room, or tap to add. Drag items in the room to move them; select one to rotate or remove it below.';
document.documentElement.lang='en';
let q=0;new MutationObserver(()=>{if(q)return;q=setTimeout(()=>{q=0;pass()},80)}).observe(document.body,{childList:true,subtree:true,characterData:true});
setTimeout(pass,0);
})()}
